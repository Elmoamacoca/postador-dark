<!doctype html>
<html lang="pt-BR" data-theme="light" data-menu="aberto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mídias · Proposta {{LETRA}} · Postador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="painel.css">
<link rel="stylesheet" href="sala.css">
<link rel="stylesheet" href="comum.css">
<style>
{{ESTILO}}
</style>
</head>
<body>

<svg class="tinta" aria-hidden="true">
  <symbol id="i-seta" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></symbol>
  <symbol id="i-agenda" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/>
      <path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></g>
  </symbol>
</svg>

<!-- O MENU JA' E' O DECIDIDO: quatro abas. A Mídia saiu do menu em 10/09, porque ela
     era configuração de origem, e não um lugar onde se trabalha. -->
<aside class="menu" aria-label="Menu do Postador">
  <div class="menu-marca">
    <img class="marca-clara" src="marca-clara.png" alt="">
    <img class="marca-escura" src="marca-escura.png" alt="">
    <span class="menu-nome">Postador</span>
  </div>
  <button class="menu-botao" id="botao-menu" aria-expanded="true"
          aria-label="Abrir ou fechar o menu">
    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <nav class="menu-rolo" id="menu">
    <button class="mi" data-pag="painel">
      <svg class="mi-ic" viewBox="0 0 24 24"><rect x="3" y="3.5" width="7.5" height="9" rx="1.6"/><rect x="13.5" y="3.5" width="7.5" height="5" rx="1.6"/><rect x="3" y="15.5" width="7.5" height="5" rx="1.6"/><rect x="13.5" y="11.5" width="7.5" height="9" rx="1.6"/></svg>
      <span class="mi-rot">Painel</span>
    </button>
    <button class="mi" data-pag="calendario">
      <svg class="mi-ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span class="mi-rot">Calendário</span>
    </button>
    <button class="mi" data-pag="analytics">
      <svg class="mi-ic" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M8 16v-5M13 16V7M18 16v-8"/></svg>
      <span class="mi-rot">Analytics</span>
    </button>
    <button class="mi ativo" data-pag="contas">
      <svg class="mi-ic" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c0-3.7 3.3-6 7.5-6s7.5 2.3 7.5 6"/></svg>
      <span class="mi-rot">Contas</span>
    </button>
  </nav>
  <div class="menu-acao">
    <button class="btn brasa" id="menu-programar" type="button"
            aria-label="Programar publicações">
      <svg class="seta seta-esq" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
      <span class="txt">
        <svg class="ag-selo" aria-hidden="true"><use href="#i-agenda"/></svg>
        <span class="ag-rot">Programar</span></span>
      <span class="circ"></span>
      <svg class="seta seta-dir" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
    </button>
  </div>
  <div class="menu-pe">
    <div class="pe-linha">
      <span class="pp" style="font-weight:700;font-variant-numeric:tabular-nums">v1</span>
      <span class="pe-rot">Proposta {{LETRA}} · 10/09</span>
    </div>
    <div class="pe-linha">
      <svg class="tema-icone" viewBox="0 0 24 24" id="tema-icone">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
      <span class="pe-rot">tema</span>
      <button class="chave" id="chave" role="switch" aria-checked="false"
              aria-label="Trocar tema"><i></i></button>
    </div>
  </div>
</aside>

<main class="palco">
  <!-- A ABA DE CONTAS E' A DE VERDADE, recortada do painel/index.html. O motor que a
       desenha e' o `07-contas.js` do painel, com um enxerto de quatro linhas. -->
  <section class="pagina ativa ct" id="pag-contas">
    <div class="cab ct-topo">
      <div>
        <h1>Contas</h1>
        <p class="p">O estado de cada conta ligada ao postador, medido direto na Meta.</p>
      </div>
      <div class="ct-dir">
        <span class="ct-vivo"><i class="ct-pulso"></i><span id="ct-relogio">vigiando</span></span>
        <button class="ct-bt" type="button" data-acao="testar-tudo">
          <span class="txt">
            <svg class="mrc" viewBox="0 0 24 24"><path d="M16.247 7.761a6 6 0 0 1 0 8.478"/><path d="M19.075 4.933a10 10 0 0 1 0 14.134"/><path d="M4.925 19.067a10 10 0 0 1 0-14.134"/><path d="M7.753 16.239a6 6 0 0 1 0-8.478"/><circle cx="12" cy="12" r="2"/></svg>
            Testar Conexões</span>
          <span class="circ"></span>
        </button>
        <button class="ct-bt verde" type="button" data-acao="ligar">
          <span class="txt">
            <svg class="mrc" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            Ligar Conta</span>
          <span class="circ"></span>
        </button>
      </div>
    </div>

    <div id="ct-aviso"></div>
    <div class="ct-grade ct-g4" id="ct-kpis"></div>

    <div class="ct-filtros">
      <div class="ct-seg" id="ct-seg"></div>
      <div class="ct-dd">
        <button class="ct-dd-bt" id="ct-dd-bt" type="button" aria-expanded="false"
                aria-haspopup="listbox">
          <span class="pt" style="background:var(--soft)"></span>
          <span id="ct-dd-v">Todos Os Mercados</span>
          <svg class="ct-i xs cv" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="ct-dd-m" id="ct-dd-m" role="listbox" hidden></div>
      </div>
      <label class="ct-busca">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="ct-busca" type="text" placeholder="Buscar conta" autocomplete="off"
               spellcheck="false">
      </label>
      <span class="ct-quantas" id="ct-quantas"></span>
    </div>

    <div class="ct-fichas" id="ct-fichas"></div>

    <!-- A NOTA DA MAQUETE. Regra da casa: dado inventado tem que se declarar. -->
    <div class="mid-nota-ex">
      <span class="mid-ex"></span>
      <span>{{NOTA}}</span>
    </div>
  </section>
</main>

<div class="ct-jan ct" id="ct-jan" hidden>
  <div class="ct-jan-fundo" data-ct-fechar></div>
  <div class="ct-jan-cx" role="dialog" aria-modal="true" aria-labelledby="ct-jan-tit">
    <div class="ct-jan-cab" id="ct-jan-cab"></div>
    <div class="ct-jan-rolo" id="ct-jan-corpo"></div>
    <div class="ct-jan-pe" id="ct-jan-pe"></div>
  </div>
</div>

<div class="mid-lupa" id="mid-lupa" hidden><img src="" alt=""></div>

<script src="dados.js"></script>
<script src="comum.js"></script>
<script>
{{SCRIPT}}
</script>
<script src="contas.js"></script>
</body>
</html>
