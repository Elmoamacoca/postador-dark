<!doctype html>
<html lang="pt-BR" data-theme="light" data-menu="aberto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Proposta A · A Sala · Postador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="painel.css">
<link rel="stylesheet" href="sala.css">
<link rel="stylesheet" href="grafico.css">
<link rel="stylesheet" href="comum.css">
<style>
/* ================================================== PROPOSTA A · A SALA
   Grade densa de cartoes, cada um com um desenho dentro. A leitura desce do que
   aconteceu (faixa de quatro) para o ritmo, o acervo, o calendario e o ranking.

   SO' GRADE. */

.pn-a-faixa { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px }
.pn-a-2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px }
.pn-a-3 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px }
.pn-a-2 > .rs-cd, .pn-a-3 > .rs-cd { display: flex; flex-direction: column }
.pn-a-2 .rs-cd-b, .pn-a-3 .rs-cd-b { flex: 1 }

/* o cartao pequeno da faixa: rotulo, numero e a curva ocupando o pe' */
.pn-a-mini .rs-cd-b { padding-top: 2px }
.pn-a-mini .pn-tit { margin-bottom: 8px }

@media (max-width: 1180px) {
  .pn-a-faixa { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .pn-a-2, .pn-a-3 { grid-template-columns: 1fr }
}

</style>
</head>
<body>

<svg class="tinta" aria-hidden="true">
  <symbol id="i-seta" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></symbol>
  <symbol id="i-agenda" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/>
      <path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></g>
  </symbol>
</svg>

<aside class="menu" aria-label="Menu do Postador">
  <div class="menu-marca">
    <img class="marca-clara" src="marca-clara.png" alt="">
    <img class="marca-escura" src="marca-escura.png" alt="">
    <span class="menu-nome">Postador</span>
  </div>
  <button class="menu-botao" id="botao-menu" aria-expanded="true"
          aria-label="Abrir ou fechar o menu">
    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <nav class="menu-rolo" id="menu">
    <button class="mi ativo" data-pag="painel">
      <svg class="mi-ic" viewBox="0 0 24 24"><rect x="3" y="3.5" width="7.5" height="9" rx="1.6"/><rect x="13.5" y="3.5" width="7.5" height="5" rx="1.6"/><rect x="3" y="15.5" width="7.5" height="5" rx="1.6"/><rect x="13.5" y="11.5" width="7.5" height="9" rx="1.6"/></svg>
      <span class="mi-rot">Painel</span>
    </button>
    <button class="mi" data-pag="calendario">
      <svg class="mi-ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span class="mi-rot">Calendário</span>
    </button>
    <button class="mi" data-pag="analytics">
      <svg class="mi-ic" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M8 16v-5M13 16V7M18 16v-8"/></svg>
      <span class="mi-rot">Analytics</span>
    </button>
    <button class="mi" data-pag="contas">
      <svg class="mi-ic" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c0-3.7 3.3-6 7.5-6s7.5 2.3 7.5 6"/></svg>
      <span class="mi-rot">Contas</span>
    </button>
  </nav>
  <div class="menu-acao">
    <button class="btn brasa" id="menu-programar" type="button"
            aria-label="Programar publicações">
      <svg class="seta seta-esq" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
      <span class="txt">
        <svg class="ag-selo" aria-hidden="true"><use href="#i-agenda"/></svg>
        <span class="ag-rot">Programar</span></span>
      <span class="circ"></span>
      <svg class="seta seta-dir" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
    </button>
  </div>
  <div class="menu-pe">
    <div class="pe-linha">
      <span class="pp" style="font-weight:700;font-variant-numeric:tabular-nums">v1</span>
      <span class="pe-rot">Proposta A · A Sala</span>
    </div>
    <div class="pe-linha">
      <svg class="tema-icone" viewBox="0 0 24 24" id="tema-icone">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
      <span class="pe-rot">tema</span>
      <button class="chave" id="chave" role="switch" aria-checked="false"
              aria-label="Trocar tema"><i></i></button>
    </div>
  </div>
</aside>

<main class="palco">
  <section class="pagina ativa rs-casa" id="pag-painel">
    <div class="cab">
      <div>
        <h1>Painel</h1>
        <p class="p" id="pn-dia">A rede, o que está guardado e o que falta sair.</p>
      </div>
      <div class="dir">
        <span class="pp" id="pn-lido"></span>
        <button class="bt mini" id="pn-atualizar">Atualizar</button>
        <button class="btn brasa" id="pn-programar" type="button">
          <svg class="seta seta-esq" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
          <span class="txt">
            <svg class="ag-selo" aria-hidden="true"><use href="#i-agenda"/></svg>
            Programar publicações</span>
          <span class="circ"></span>
          <svg class="seta seta-dir" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
        </button>
      </div>
    </div>
    <div id="pn-palco"></div>
  </section>
</main>

<div class="rs-tip" id="rs-tip" hidden></div>

<script src="dados.js"></script>
<script src="casa.js"></script>
<script src="comum.js"></script>
<script>
/* ================================================== PROPOSTA A · A SALA
   Oito desenhos, nenhum bloco so' de texto:
     faixa    quatro cartoes com numero e minicurva
     ritmo    publicacao e visualizacao por semana, no motor da casa
     acervo   rosca dos 180 guardados
     calor    mapa de calor de 90 dias
     hora     colunas por hora de saida
     ranking  as publicacoes por visualizacao
     funil    do Drive ate' o publicado
     travas   a lista curta do que trava, cada uma com o botao
   ========================================================================== */
(function () {
  var P = window.PN;
  var palco = document.getElementById('pn-palco');
  var janela = 90, medida = 'views', vista = 'area';

  function mini(k) {
    return '<section class="rs-cd pn-a-mini">' + P.cab(k.rot)
      + '<div class="rs-cd-b"><div class="pn-tit"><b class="rs-tn">' + k.valor + '</b>'
      + '<span>' + P.seguro(k.pe) + '</span></div>'
      + (k.curva || '') + '</div></section>';
  }

  /* A MINICURVA OLHA 90 DIAS, e nao 30: a rede publicou em junho e parou, entao a
     janela de 30 desenha uma linha reta em todos os quatro cartoes. */
  function curvaDe(pegar) { return P.spark(P.SERIE.slice(-90).map(pegar)); }
  function porDia(campo) {
    return function (p) {
      var t = 0;
      P.POSTS.forEach(function (x) {
        if (x.quando.slice(0, 10) === p.dia) t += x[campo]; });
      return t;
    };
  }

  /* AS DUAS MEDIDAS NAO DIVIDEM O MESMO DESENHO: 245 visualizacoes e 1 publicacao na
     mesma regua achatam a publicacao contra o chao. O segmentado escolhe qual medida
     o grafico mostra, como na aba de Analytics. */
  function pintarRitmo() {
    var alvo = document.getElementById('a-ritmo');
    var series = medida === 'views' ? [P.serieViews(janela)]
      : P.seriePorConta(janela, vista);
    P.motor(alvo, { tipo: vista, dominio: P.dominio(janela), series: series });
    document.getElementById('a-leg').innerHTML = series.map(function (s) {
      return '<span><i style="background:' + s.cor + '"></i>' + P.seguro(s.rot)
        + '</span>';
    }).join('');
  }

  function montar() {
    var R = P.RESUMO;
    var views30 = P.POSTS.filter(function (p) { return P.dias(p.quando) <= 30; })
      .reduce(function (t, p) { return t + p.views; }, 0);

    palco.innerHTML =
      '<div class="pn-a-faixa">'
      + mini({ rot: 'Publicações', valor: P.n(R.publicados), pe: 'em 90 dias',
               curva: curvaDe(P.somaDia) })
      + mini({ rot: 'Visualizações', valor: P.curto(R.views),
               pe: P.n(views30) + ' nos últimos 30',
               curva: curvaDe(porDia('views')) })
      + mini({ rot: 'Engajamento', valor: P.n(R.eng), pe: 'curtida e comentário',
               curva: curvaDe(porDia('eng')) })
      /* O QUARTO NAO TEM CURVA, E E' DE PROPOSITO: a fila e' um estoque, nao uma
         serie, e curva de fila zerada desenha uma linha reta que nao diz nada. O
         trilho mostra quanto do acervo ja' saiu. */
      + '<section class="rs-cd pn-a-mini">' + P.cab('Fila')
      + '<div class="rs-cd-b"><div class="pn-tit"><b class="rs-tn">' + P.n(R.fila)
      + '</b><span>de ' + P.n(R.prateleira) + ' guardados</span></div>'
      + '<div class="rs-li-tr" style="margin-top:16px"><i style="width:'
      + Math.max(2, Math.round((R.publicados / Math.max(R.acervo, 1)) * 100))
      + '%;background:var(--accent)"></i></div>'
      + '<div class="pn-leg"><span>' + P.n(R.publicados) + ' publicados de '
      + P.n(R.acervo) + ' no drive</span></div></div></section>'
      + '</div>'

      + '<div class="pn-a-2">'
      + '<section class="rs-cd">' + P.cab('O ritmo',
          P.seg('a-med', [['views', 'Visualizações'], ['posts', 'Publicações']], medida)
          + P.seg('a-jan', [[30, '30 dias'], [90, '90']], janela))
      + '<div class="rs-cd-b"><div class="pn-graf pn-alto" id="a-ritmo"></div>'
      + '<div class="pn-leg" id="a-leg"></div></div></section>'
      + '<section class="rs-cd">' + P.cab('O acervo')
      + '<div class="rs-cd-b">' + P.rosca([
          { rot: 'Prateleira', v: R.prateleira, cor: 'var(--chart-1)' },
          { rot: 'Programados', v: R.fila, cor: 'var(--chart-3)' },
          { rot: 'Publicados', v: R.publicados, cor: 'var(--chart-2)' }
        ], P.n(R.acervo), 'no drive') + '</div></section>'
      + '</div>'

      + '<div class="pn-a-3">'
      + '<section class="rs-cd">' + P.cab('Os dias com publicação',
          '<span class="rs-rot3">90 dias</span>')
      + '<div class="rs-cd-b">' + P.calor(91) + '</div></section>'
      + '<section class="rs-cd">' + P.cab('A hora de saída')
      + '<div class="rs-cd-b">' + P.colunas(P.porHora(), 148) + '</div></section>'
      + '</div>'

      + '<div class="pn-a-3">'
      + '<section class="rs-cd">' + P.cab('As publicações por visualização')
      + '<div class="rs-cd-b">' + P.barrasH(P.porViews()) + '</div></section>'
      + '<section class="rs-cd">' + P.cab('Do Drive até o ar')
      + '<div class="rs-cd-b">' + P.funilAcervo() + '</div></section>'
      + '</div>'

      + '<section class="rs-cd">' + P.cab('O que trava',
          '<span class="rs-pil ' + (P.travas().length ? 'bl' : 'no') + '">'
          + P.travas().length + '</span>')
      + '<div class="rs-cd-b">' + P.listaTravas(P.travas()) + '</div></section>';

    pintarRitmo();
    function liga(id, aoTrocar) {
      document.getElementById(id).addEventListener('click', function (e) {
        var b = e.target.closest('[data-v]'); if (!b) return;
        aoTrocar(b.dataset.v);
        this.querySelectorAll('[data-v]').forEach(function (o) {
          o.classList.toggle('on', o === b);
        });
        pintarRitmo();
      });
    }
    liga('a-jan', function (v) { janela = parseInt(v, 10); });
    liga('a-med', function (v) {
      medida = v;
      /* publicacao e' contagem de dia: coluna. visualizacao e' volume: curva. */
      vista = v === 'posts' ? 'barra' : 'area';
    });
  }

  P.casca();
  montar();
  document.getElementById('pn-atualizar').addEventListener('click', montar);
})();

</script>
</body>
</html>
