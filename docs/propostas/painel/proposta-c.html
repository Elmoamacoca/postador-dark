<!doctype html>
<html lang="pt-BR" data-theme="light" data-menu="aberto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Proposta C · O Mosaico · Postador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="painel.css">
<link rel="stylesheet" href="sala.css">
<link rel="stylesheet" href="grafico.css">
<link rel="stylesheet" href="comum.css">
<style>
/* ================================================== PROPOSTA C · O MOSAICO
   Bento de gráficos: blocos de tamanhos diferentes, um desenho dentro de cada, no
   molde do Stats Bento e do Advanced Stats do 21st.dev. O maior bloco e' o ritmo,
   e os outros giram em volta dele.

   SO' GRADE. */

.pn-c-bento { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 14px }
.pn-c-bento > .rs-cd { display: flex; flex-direction: column; min-width: 0 }
.pn-c-bento .rs-cd-b { flex: 1 }
.pn-c-heroi { grid-column: span 4 }
.pn-c-lado { grid-column: span 2 }
.pn-c-meia { grid-column: span 3 }
.pn-c-terco { grid-column: span 2 }
.pn-c-cheia { grid-column: span 6 }

/* o numero grande que abre o bloco do ritmo */
.pn-c-tit { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  margin-bottom: 10px }
.pn-c-tit b { font-size: 32px; font-weight: 800; letter-spacing: -.04em;
  font-variant-numeric: tabular-nums; line-height: 1 }

@media (max-width: 1180px) {
  .pn-c-bento { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .pn-c-heroi, .pn-c-lado, .pn-c-meia, .pn-c-terco, .pn-c-cheia { grid-column: span 2 }
}

</style>
</head>
<body>

<svg class="tinta" aria-hidden="true">
  <symbol id="i-seta" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></symbol>
  <symbol id="i-agenda" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/>
      <path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></g>
  </symbol>
</svg>

<aside class="menu" aria-label="Menu do Postador">
  <div class="menu-marca">
    <img class="marca-clara" src="marca-clara.png" alt="">
    <img class="marca-escura" src="marca-escura.png" alt="">
    <span class="menu-nome">Postador</span>
  </div>
  <button class="menu-botao" id="botao-menu" aria-expanded="true"
          aria-label="Abrir ou fechar o menu">
    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <nav class="menu-rolo" id="menu">
    <button class="mi ativo" data-pag="painel">
      <svg class="mi-ic" viewBox="0 0 24 24"><rect x="3" y="3.5" width="7.5" height="9" rx="1.6"/><rect x="13.5" y="3.5" width="7.5" height="5" rx="1.6"/><rect x="3" y="15.5" width="7.5" height="5" rx="1.6"/><rect x="13.5" y="11.5" width="7.5" height="9" rx="1.6"/></svg>
      <span class="mi-rot">Painel</span>
    </button>
    <button class="mi" data-pag="calendario">
      <svg class="mi-ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span class="mi-rot">Calendário</span>
    </button>
    <button class="mi" data-pag="analytics">
      <svg class="mi-ic" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M8 16v-5M13 16V7M18 16v-8"/></svg>
      <span class="mi-rot">Analytics</span>
    </button>
    <button class="mi" data-pag="contas">
      <svg class="mi-ic" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c0-3.7 3.3-6 7.5-6s7.5 2.3 7.5 6"/></svg>
      <span class="mi-rot">Contas</span>
    </button>
  </nav>
  <div class="menu-acao">
    <button class="btn brasa" id="menu-programar" type="button"
            aria-label="Programar publicações">
      <svg class="seta seta-esq" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
      <span class="txt">
        <svg class="ag-selo" aria-hidden="true"><use href="#i-agenda"/></svg>
        <span class="ag-rot">Programar</span></span>
      <span class="circ"></span>
      <svg class="seta seta-dir" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
    </button>
  </div>
  <div class="menu-pe">
    <div class="pe-linha">
      <span class="pp" style="font-weight:700;font-variant-numeric:tabular-nums">v1</span>
      <span class="pe-rot">Proposta C · O Mosaico</span>
    </div>
    <div class="pe-linha">
      <svg class="tema-icone" viewBox="0 0 24 24" id="tema-icone">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
      <span class="pe-rot">tema</span>
      <button class="chave" id="chave" role="switch" aria-checked="false"
              aria-label="Trocar tema"><i></i></button>
    </div>
  </div>
</aside>

<main class="palco">
  <section class="pagina ativa rs-casa" id="pag-painel">
    <div class="cab">
      <div>
        <h1>Painel</h1>
        <p class="p" id="pn-dia">A rede, o que está guardado e o que falta sair.</p>
      </div>
      <div class="dir">
        <span class="pp" id="pn-lido"></span>
        <button class="bt mini" id="pn-atualizar">Atualizar</button>
        <button class="btn brasa" id="pn-programar" type="button">
          <svg class="seta seta-esq" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
          <span class="txt">
            <svg class="ag-selo" aria-hidden="true"><use href="#i-agenda"/></svg>
            Programar publicações</span>
          <span class="circ"></span>
          <svg class="seta seta-dir" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
        </button>
      </div>
    </div>
    <div id="pn-palco"></div>
  </section>
</main>

<div class="rs-tip" id="rs-tip" hidden></div>

<script src="dados.js"></script>
<script src="casa.js"></script>
<script src="comum.js"></script>
<script>
/* ================================================== PROPOSTA C · O MOSAICO
   Bento de graficos, no molde do Stats Bento e do Advanced Stats do 21st.dev. Nove
   blocos, todos com desenho: ritmo, acervo, contas, dia da semana, hora, calor,
   funil, ranking e travas.
   ========================================================================== */
(function () {
  var P = window.PN;
  var palco = document.getElementById('pn-palco');
  var janela = 90, medida = 'views';

  /* UMA MEDIDA POR VEZ NO DESENHO. Visualizacao chega a 4 mil e publicacao a uma por
     dia: na mesma regua, a publicacao vira uma linha colada no chao. O motor escala
     pela primeira serie, entao juntar as duas tambem estoura a de cima para fora do
     quadro. O segmentado escolhe, como na aba de Analytics. */
  function pintarRitmo() {
    var alvo = document.getElementById('c-ritmo');
    var vista = medida === 'posts' ? 'barra' : 'area';
    var series = medida === 'views' ? [P.serieViews(janela)]
      : P.seriePorConta(janela, vista);
    P.motor(alvo, { tipo: vista, dominio: P.dominio(janela), series: series });
    document.getElementById('c-leg').innerHTML = series.map(function (s) {
      return '<span><i style="background:' + s.cor + '"></i>' + P.seguro(s.rot)
        + '</span>';
    }).join('');
  }

  function montar() {
    var R = P.RESUMO;
    var contas = P.CONTAS.map(function (c, i) {
      var meus = c.meus || [];
      return { rot: '@' + c.u, logo: c.avatar,
               pe: P.n(meus.length) + ' ' + P.plural(meus.length, 'publicação',
                    'publicações') + ' · ' + P.n(c.prateleira) + ' guardados',
               v: meus.reduce(function (t, p) { return t + p.views; }, 0),
               un: 'visualizações', cor: P.CORES[i % P.CORES.length] };
    });

    palco.innerHTML = '<div class="pn-c-bento">'

      + '<section class="rs-cd pn-c-heroi">' + P.cab('O ritmo da rede',
          P.seg('c-med', [['views', 'Visualizações'], ['posts', 'Publicações']], medida)
          + P.seg('c-jan', [[30, '30 dias'], [90, '90']], janela))
      + '<div class="rs-cd-b"><div class="pn-c-tit"><b class="rs-tn">'
      + P.curto(R.views) + '</b><span class="rs-rot2">visualizações</span>'
      + '<b class="rs-tn">' + P.n(R.publicados) + '</b>'
      + '<span class="rs-rot2">publicações</span>'
      + '<b class="rs-tn">' + P.n(R.eng) + '</b>'
      + '<span class="rs-rot2">engajamento</span></div>'
      + '<div class="pn-graf pn-alto" id="c-ritmo"></div>'
      + '<div class="pn-leg" id="c-leg"></div></div></section>'

      + '<section class="rs-cd pn-c-lado">' + P.cab('O acervo')
      + '<div class="rs-cd-b">' + P.rosca([
          { rot: 'Prateleira', v: R.prateleira, cor: 'var(--chart-1)' },
          { rot: 'Programados', v: R.fila, cor: 'var(--chart-3)' },
          { rot: 'Publicados', v: R.publicados, cor: 'var(--chart-2)' }
        ], P.n(R.acervo), 'no drive') + '</div></section>'

      + '<section class="rs-cd pn-c-terco">' + P.cab('O dia da semana')
      + '<div class="rs-cd-b">' + P.colunas(P.porDiaSemana(), 128) + '</div></section>'

      + '<section class="rs-cd pn-c-terco">' + P.cab('A hora de saída')
      + '<div class="rs-cd-b">' + P.colunas(P.porHora(), 128) + '</div></section>'

      + '<section class="rs-cd pn-c-terco">' + P.cab('Do Drive até o ar')
      + '<div class="rs-cd-b">' + P.funilAcervo() + '</div></section>'

      + '<section class="rs-cd pn-c-cheia">' + P.cab('Os dias com publicação',
          '<span class="rs-rot3">90 dias</span>')
      + '<div class="rs-cd-b">' + P.calor(91) + '</div></section>'

      + '<section class="rs-cd pn-c-meia">' + P.cab('As contas por visualização')
      + '<div class="rs-cd-b">' + P.barrasH(contas) + '</div></section>'

      + '<section class="rs-cd pn-c-meia">' + P.cab('As publicações por visualização')
      + '<div class="rs-cd-b">' + P.barrasH(P.porViews().slice(0, 4))
      + '</div></section>'

      + '<section class="rs-cd pn-c-cheia">' + P.cab('O que trava',
          '<span class="rs-pil ' + (P.travas().length ? 'bl' : 'no') + '">'
          + P.travas().length + '</span>')
      + '<div class="rs-cd-b">' + P.listaTravas(P.travas()) + '</div></section>'

      + '</div>';

    pintarRitmo();
    document.getElementById('c-jan').addEventListener('click', function (e) {
      var b = e.target.closest('[data-v]'); if (!b) return;
      janela = parseInt(b.dataset.v, 10);
      this.querySelectorAll('[data-v]').forEach(function (o) {
        o.classList.toggle('on', o === b); });
      pintarRitmo();
    });
    document.getElementById('c-med').addEventListener('click', function (e) {
      var b = e.target.closest('[data-v]'); if (!b) return;
      medida = b.dataset.v;
      this.querySelectorAll('[data-v]').forEach(function (o) {
        o.classList.toggle('on', o === b); });
      pintarRitmo();
    });
  }

  P.casca();
  montar();
  document.getElementById('pn-atualizar').addEventListener('click', montar);
})();

</script>
</body>
</html>
