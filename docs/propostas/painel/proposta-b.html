<!doctype html>
<html lang="pt-BR" data-theme="light" data-menu="aberto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Proposta B · O Mosaico · Postador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="painel.css">

<style>
/* ================================================== PROPOSTA B · O MOSAICO
   O arranjo do Stats Bento do 21st.dev, lido do pacote publico da demo em 11/09:
   blocos de tamanhos diferentes, com UM numero dominante mandando na tela e os
   outros em volta. Aqui o numero dominante e' o que decide o dia: quantas
   publicacoes estao programadas.

   SO' GRADE. */

.pn-b-bento { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-auto-rows: minmax(128px, auto); gap: 14px }
.pn-b-heroi { grid-column: span 3; grid-row: span 2; display: flex;
  flex-direction: column; justify-content: space-between }
.pn-b-larga { grid-column: span 3 }
/* OS TRES PEQUENOS DIVIDEM A SEGUNDA LINHA ao lado do bloco dominante: tres de uma
   coluna fecham as seis exatamente. Com dois de duas colunas sobrava uma celula, e o
   mosaico ficava com buraco no meio, que e' o defeito que o bento existe para evitar. */
.pn-b-terco { grid-column: span 1 }

/* o bloco dominante: o numero manda, e a frase embaixo diz o que ele significa */
.pn-b-num { font-size: 78px; font-weight: 800; letter-spacing: -.05em; line-height: .95;
  font-variant-numeric: tabular-nums }
.pn-b-heroi .rs-cd-b { display: flex; flex-direction: column; gap: 14px }
.pn-b-frase { font-size: 14px; color: var(--muted); max-width: 38ch }
.pn-b-frase b { color: var(--ink); font-weight: 700 }
.pn-b-acao { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }

/* o trilho de uso da prateleira, a peca `.rs-li-tr` da sala */
.pn-b-uso { margin-top: 12px }
.pn-b-lin { display: flex; align-items: baseline; justify-content: space-between;
  gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 7px }
.pn-b-lin b { color: var(--ink); font-weight: 700 }

/* NO BLOCO ESTREITO A LINHA DE BAIXO EMPILHA. A pilula e a leitura lado a lado
   cabem nos 300 pixels da faixa da proposta A, nao nos 178 daqui: a frase saia
   cortada no meio, e frase cortada e' o defeito que esta tela existe para nao ter. */
.pn-b-terco .lin > span { display: flex; flex-direction: column; align-items: flex-start;
  gap: 7px }
.pn-b-terco .rs-delta-pe { margin-left: 0 }

.pn-b-duas { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
  gap: 16px; align-items: stretch }
.pn-b-duas > .rs-cd { display: flex; flex-direction: column }
.pn-b-duas .rs-cd-b { flex: 1 }

@media (max-width: 1180px) {
  .pn-b-bento { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .pn-b-heroi, .pn-b-larga, .pn-b-terco { grid-column: span 2 }
  .pn-b-heroi { grid-row: auto }
  .pn-b-duas { grid-template-columns: 1fr }
}

</style>
</head>
<body>

<svg class="tinta" aria-hidden="true">
  <symbol id="i-seta" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></symbol>
  <symbol id="i-agenda" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/>
      <path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></g>
  </symbol>
</svg>

<aside class="menu" aria-label="Menu do Postador">
  <div class="menu-marca">
    <img class="marca-clara" src="marca-clara.png" alt="">
    <img class="marca-escura" src="marca-escura.png" alt="">
    <span class="menu-nome">Postador</span>
  </div>
  <button class="menu-botao" id="botao-menu" aria-expanded="true"
          aria-label="Abrir ou fechar o menu">
    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <nav class="menu-rolo" id="menu">
    <button class="mi ativo" data-pag="painel">
      <svg class="mi-ic" viewBox="0 0 24 24"><rect x="3" y="3.5" width="7.5" height="9" rx="1.6"/><rect x="13.5" y="3.5" width="7.5" height="5" rx="1.6"/><rect x="3" y="15.5" width="7.5" height="5" rx="1.6"/><rect x="13.5" y="11.5" width="7.5" height="9" rx="1.6"/></svg>
      <span class="mi-rot">Painel</span>
    </button>
    <button class="mi" data-pag="calendario">
      <svg class="mi-ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span class="mi-rot">Calendário</span>
    </button>
    <button class="mi" data-pag="analytics">
      <svg class="mi-ic" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M8 16v-5M13 16V7M18 16v-8"/></svg>
      <span class="mi-rot">Analytics</span>
    </button>
    <button class="mi" data-pag="contas">
      <svg class="mi-ic" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c0-3.7 3.3-6 7.5-6s7.5 2.3 7.5 6"/></svg>
      <span class="mi-rot">Contas</span>
    </button>
  </nav>
  <div class="menu-acao">
    <button class="btn brasa" id="menu-programar" type="button"
            aria-label="Programar publicações">
      <svg class="seta seta-esq" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
      <span class="txt">
        <svg class="ag-selo" aria-hidden="true"><use href="#i-agenda"/></svg>
        <span class="ag-rot">Programar</span></span>
      <span class="circ"></span>
      <svg class="seta seta-dir" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
    </button>
  </div>
  <div class="menu-pe">
    <div class="pe-linha">
      <span class="pp" style="font-weight:700;font-variant-numeric:tabular-nums">v1</span>
      <span class="pe-rot">Proposta B · O Mosaico</span>
    </div>
    <div class="pe-linha">
      <svg class="tema-icone" viewBox="0 0 24 24" id="tema-icone">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
      <span class="pe-rot">tema</span>
      <button class="chave" id="chave" role="switch" aria-checked="false"
              aria-label="Trocar tema"><i></i></button>
    </div>
  </div>
</aside>

<main class="palco">
  <section class="pagina ativa rs-casa" id="pag-painel">
    <div class="cab">
      <div>
        <h1>Painel</h1>
        <p class="p" id="pn-dia">A rede, o que está guardado e o que falta sair.</p>
      </div>
      <div class="dir">
        <span class="pp" id="pn-lido"></span>
        <button class="bt mini" id="pn-atualizar">Atualizar</button>
        <button class="btn brasa" id="pn-programar" type="button">
          <svg class="seta seta-esq" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
          <span class="txt">
            <svg class="ag-selo" aria-hidden="true"><use href="#i-agenda"/></svg>
            Programar publicações</span>
          <span class="circ"></span>
          <svg class="seta seta-dir" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
        </button>
      </div>
    </div>
    <div id="pn-palco"></div>
  </section>
</main>

<div class="rs-tip" id="rs-tip" hidden></div>

<script src="dados.js"></script>
<script src="casa.js"></script>
<script src="comum.js"></script>
<script>
/* ================================================== PROPOSTA B · O MOSAICO
   UMA PERGUNTA MANDA NA TELA: vai sair alguma coisa? O bloco grande responde com o
   numero da fila e com o caminho para mudar isso. Em volta, os blocos menores dizem
   com o que se conta: contas de pe, prateleira, erro e o ritmo dos ultimos 30 dias.
   Embaixo, os dias em que saiu alguma coisa e a lista do que ja' saiu.
   ========================================================================== */
(function () {
  var P = window.PN;
  var palco = document.getElementById('pn-palco');
  var R = P.RESUMO;

  function heroi() {
    var fila = R.fila || 0;
    var frase = fila
      ? '<b>' + P.n(fila) + '</b> ' + P.plural(fila, 'vídeo tem', 'vídeos têm')
        + ' data marcada. É o que vai sair sem ninguém mexer.'
      : 'Nenhum vídeo tem data marcada. Enquanto a fila estiver zerada, <b>nada sai '
        + 'sozinho</b>, mesmo com a rede de pé e com a prateleira cheia.';
    return '<section class="rs-cd pn-b-heroi"><div class="rs-cd-h">'
      + '<h3>Vai sair alguma coisa?</h3>'
      + '<span class="rs-pil ' + (fila ? 'no' : 'bl') + '">'
      + (fila ? 'fila andando' : 'fila vazia') + '</span></div>'
      + '<div class="rs-cd-b">'
      + '<div class="pn-b-num rs-tn">' + P.n(fila) + '</div>'
      + '<p class="pn-b-frase">' + frase + '</p>'
      + '<div class="pn-b-acao">'
      + '<button class="btn brasa" type="button" style="--btn-larg:230px">'
      + '<svg class="seta seta-esq" viewBox="0 0 24 24"><use href="#i-seta"/></svg>'
      + '<span class="txt"><svg class="ag-selo" aria-hidden="true">'
      + '<use href="#i-agenda"/></svg>Programar publicações</span>'
      + '<span class="circ"></span>'
      + '<svg class="seta seta-dir" viewBox="0 0 24 24"><use href="#i-seta"/></svg>'
      + '</button>'
      + '<span class="rs-rot3">' + (R.prateleira
        ? P.n(R.prateleira) + ' vídeos esperando' : 'sem vídeo guardado') + '</span>'
      + '</div></div></section>';
  }

  function prateleira() {
    var usados = P.PASTAS.reduce(function (t, p) {
      return t + (p.programados || 0) + (p.publicados || 0); }, 0);
    var total = P.PASTAS.reduce(function (t, p) { return t + (p.total || 0); }, 0) || 1;
    var pct = Math.round((usados / total) * 100);
    return '<section class="rs-cd pn-b-larga"><div class="rs-cd-h">'
      + '<h3>A prateleira</h3><span class="rs-rot3">' + P.PASTAS.length + ' '
      + P.plural(P.PASTAS.length, 'pasta ligada', 'pastas ligadas') + '</span></div>'
      + '<div class="rs-cd-b"><div class="pn-b-lin"><span><b>' + P.n(R.prateleira || 0)
      + '</b> vídeos prontos e sem uso</span><span>' + pct + '% do acervo já usado'
      + '</span></div><div class="rs-li-tr"><i style="width:' + Math.max(pct, 1)
      + '%;background:var(--accent)"></i></div>'
      + '<div class="rs-lista" style="margin-top:14px">' + P.PASTAS.map(function (p) {
        return '<div class="rs-li semi"><span class="nm"><b>' + P.seguro(p.nome)
          + '</b>' + (p.conta ? '@' + P.seguro(p.conta) : 'sem conta ligada')
          + '</span><span class="vl rs-tn">' + P.n(p.prateleira)
          + '<small>na prateleira</small></span></div>';
      }).join('') + '</div></div></section>';
  }

  function bloco(k) { return P.kpi(k).replace('rs-cd rs-kpi', 'rs-cd rs-kpi pn-b-terco'); }

  function montar() {
    var m = P.medidas();
    var travas = P.travas();

    palco.innerHTML =
      '<div class="pn-b-bento">'
      + heroi()
      + prateleira()
      + bloco(m[0])                       /* contas de pé */
      + bloco(m[3])                       /* últimos 30 dias, com a minicurva */
      + bloco({ rot: 'Erros De Envio', ico: 'alerta', valor: P.n(R.erros || 0),
                pil: R.erros ? 'precisa de você' : 'nenhum',
                tom: R.erros ? 'dw' : '',
                pe: R.erros ? 'vídeos recusados pela Meta' : 'nada foi recusado' })
      + '</div>'

      + '<div class="pn-b-duas">'
      + '<section class="rs-cd"><div class="rs-cd-h">'
      + '<h3>Os dias em que saiu alguma coisa</h3>'
      + '<span class="rs-rot3">últimos 90 dias</span></div>'
      + '<div class="rs-cd-b"><p class="pn-abre">Cada quadrinho é um dia, e a força da '
      + 'cor é o tanto que saiu nele.</p>' + P.mapaCalor(91)
      + '<div style="margin-top:16px">' + P.leituraCalor(91) + '</div></div></section>'
      + '<section class="rs-cd"><div class="rs-cd-h"><h3>O que aconteceu</h3>'
      + '<span class="rs-pil ' + (travas.length ? 'bl' : 'no') + '">'
      + (travas.length ? travas.length + ' ' + P.plural(travas.length, 'trava', 'travas')
                       : 'nada travado') + '</span></div>'
      + '<div class="rs-cd-b">'
      + P.fita(travas.map(function (t) {
          return { ico: t.ico, tom: 'am', titulo: t.titulo, desc: t.desc,
                   botao: t.botao, forte: t.forte, vai: t.vai };
        }).concat(P.saidasRecentes(6)))
      + '</div></section></div>';
  }

  P.casca();
  montar();
  document.getElementById('pn-atualizar').addEventListener('click', montar);
})();

</script>
</body>
</html>
