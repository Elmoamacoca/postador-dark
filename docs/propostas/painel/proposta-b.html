<!doctype html>
<html lang="pt-BR" data-theme="light" data-menu="aberto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Proposta B · O Mural · Postador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="painel.css">
<link rel="stylesheet" href="sala.css">
<link rel="stylesheet" href="grafico.css">
<link rel="stylesheet" href="comum.css">
<style>
/* ================================================== PROPOSTA B · O MURAL
   O molde e' o Crypto Dashboard do 21st.dev, lido do pacote publico em 11/09: um
   cartao por entidade, com identidade em cima, numero grande, variacao, o grafico
   ocupando o corpo e pares de numero no rodape. Aqui cada entidade e' uma conta.

   SO' GRADE. */

.pn-b-contas { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 16px }
.pn-b-topo { display: flex; align-items: center; gap: 11px; margin-bottom: 14px }
.pn-b-topo img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
  flex: none }
.pn-b-topo .nm { min-width: 0; flex: 1 }
.pn-b-topo .nm b { display: block; font-size: 14px; font-weight: 800;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.pn-b-num { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px }
.pn-b-num b { font-size: 30px; font-weight: 800; letter-spacing: -.04em;
  font-variant-numeric: tabular-nums; line-height: 1 }
.pn-b-pes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px; margin-top: 14px; padding-top: 13px;
  border-top: 1px solid var(--rule-solid) }
.pn-b-pes > div { min-width: 0 }
.pn-b-pes .vl { font-size: 15px; font-weight: 800; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; margin-top: 3px }

.pn-b-tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px }
.pn-b-duas { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  gap: 16px }
.pn-b-tres > .rs-cd, .pn-b-duas > .rs-cd { display: flex; flex-direction: column }
.pn-b-tres .rs-cd-b, .pn-b-duas .rs-cd-b { flex: 1 }

@media (max-width: 1180px) {
  .pn-b-tres, .pn-b-duas { grid-template-columns: 1fr }
}

</style>
</head>
<body>

<svg class="tinta" aria-hidden="true">
  <symbol id="i-seta" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></symbol>
  <symbol id="i-agenda" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/>
      <path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></g>
  </symbol>
</svg>

<aside class="menu" aria-label="Menu do Postador">
  <div class="menu-marca">
    <img class="marca-clara" src="marca-clara.png" alt="">
    <img class="marca-escura" src="marca-escura.png" alt="">
    <span class="menu-nome">Postador</span>
  </div>
  <button class="menu-botao" id="botao-menu" aria-expanded="true"
          aria-label="Abrir ou fechar o menu">
    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <nav class="menu-rolo" id="menu">
    <button class="mi ativo" data-pag="painel">
      <svg class="mi-ic" viewBox="0 0 24 24"><rect x="3" y="3.5" width="7.5" height="9" rx="1.6"/><rect x="13.5" y="3.5" width="7.5" height="5" rx="1.6"/><rect x="3" y="15.5" width="7.5" height="5" rx="1.6"/><rect x="13.5" y="11.5" width="7.5" height="9" rx="1.6"/></svg>
      <span class="mi-rot">Painel</span>
    </button>
    <button class="mi" data-pag="calendario">
      <svg class="mi-ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span class="mi-rot">Calendário</span>
    </button>
    <button class="mi" data-pag="analytics">
      <svg class="mi-ic" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M8 16v-5M13 16V7M18 16v-8"/></svg>
      <span class="mi-rot">Analytics</span>
    </button>
    <button class="mi" data-pag="contas">
      <svg class="mi-ic" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c0-3.7 3.3-6 7.5-6s7.5 2.3 7.5 6"/></svg>
      <span class="mi-rot">Contas</span>
    </button>
  </nav>
  <div class="menu-acao">
    <button class="btn brasa" id="menu-programar" type="button"
            aria-label="Programar publicações">
      <svg class="seta seta-esq" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
      <span class="txt">
        <svg class="ag-selo" aria-hidden="true"><use href="#i-agenda"/></svg>
        <span class="ag-rot">Programar</span></span>
      <span class="circ"></span>
      <svg class="seta seta-dir" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
    </button>
  </div>
  <div class="menu-pe">
    <div class="pe-linha">
      <span class="pp" style="font-weight:700;font-variant-numeric:tabular-nums">v1</span>
      <span class="pe-rot">Proposta B · O Mural</span>
    </div>
    <div class="pe-linha">
      <svg class="tema-icone" viewBox="0 0 24 24" id="tema-icone">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
      <span class="pe-rot">tema</span>
      <button class="chave" id="chave" role="switch" aria-checked="false"
              aria-label="Trocar tema"><i></i></button>
    </div>
  </div>
</aside>

<main class="palco">
  <section class="pagina ativa rs-casa" id="pag-painel">
    <div class="cab">
      <div>
        <h1>Painel</h1>
        <p class="p" id="pn-dia">A rede, o que está guardado e o que falta sair.</p>
      </div>
      <div class="dir">
        <span class="pp" id="pn-lido"></span>
        <button class="bt mini" id="pn-atualizar">Atualizar</button>
        <button class="btn brasa" id="pn-programar" type="button">
          <svg class="seta seta-esq" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
          <span class="txt">
            <svg class="ag-selo" aria-hidden="true"><use href="#i-agenda"/></svg>
            Programar publicações</span>
          <span class="circ"></span>
          <svg class="seta seta-dir" viewBox="0 0 24 24"><use href="#i-seta"/></svg>
        </button>
      </div>
    </div>
    <div id="pn-palco"></div>
  </section>
</main>

<div class="rs-tip" id="rs-tip" hidden></div>

<script src="dados.js"></script>
<script src="casa.js"></script>
<script src="comum.js"></script>
<script>
/* ================================================== PROPOSTA B · O MURAL
   A rede nao aparece somada em cima: cada conta tem o cartao dela, com o grafico
   dentro, no molde do Crypto Dashboard do 21st.dev. Embaixo, os desenhos da rede:
   funil, dia da semana, hora, mapa de calor e ranking.
   ========================================================================== */
(function () {
  var P = window.PN;
  var palco = document.getElementById('pn-palco');

  function cartaoConta(c, i) {
    var meus = c.meus || [];
    var views = meus.reduce(function (t, p) { return t + p.views; }, 0);
    var eng = meus.reduce(function (t, p) { return t + p.eng; }, 0);
    var estado = !c.ligada ? ['bl', 'Caída'] : c.fila ? ['no', 'Publicando']
      : ['pa', 'Parada'];
    var cor = P.CORES[i % P.CORES.length];
    var vals = c.serie.slice(-90).map(function (v) { return v[1]; });
    var viewsDia = c.serie.slice(-90).map(function (v) {
      var t = 0;
      meus.forEach(function (p) {
        if (p.quando.slice(0, 10) === v[0]) t += p.views; });
      return t;
    });
    return '<section class="rs-cd"><div class="rs-cd-b" style="padding-top:15px">'
      + '<div class="pn-b-topo">'
      + (c.avatar ? '<img src="' + c.avatar + '" alt="">' : '')
      + '<span class="nm"><b>@' + P.seguro(c.u) + '</b><span class="rs-rot3">'
      + P.seguro(c.mercado || c.nome) + '</span></span>'
      + '<span class="rs-pil ' + estado[0] + '">' + estado[1] + '</span></div>'
      + '<div class="pn-b-num"><b class="rs-tn">' + P.curto(views) + '</b>'
      + '<span class="rs-rot2">visualizações</span></div>'
      + P.spark(viewsDia.some(function (v) { return v; }) ? viewsDia : vals, cor)
      + '<div class="pn-b-pes">'
      + '<div><span class="rs-rot2">Publicou</span><div class="vl rs-tn">'
      + P.n(meus.length) + '</div></div>'
      + '<div><span class="rs-rot2">Engajou</span><div class="vl rs-tn">'
      + P.n(eng) + '</div></div>'
      + '<div><span class="rs-rot2">Fila</span><div class="vl rs-tn">'
      + (c.fila ? P.n(c.fila) : '—') + '</div></div>'
      + '<div><span class="rs-rot2">Guardados</span><div class="vl rs-tn">'
      + (c.prateleira ? P.n(c.prateleira) : '—') + '</div></div>'
      + '</div></div></section>';
  }

  function montar() {
    var R = P.RESUMO;

    palco.innerHTML =
      '<div class="pn-b-contas">' + P.CONTAS.map(cartaoConta).join('') + '</div>'

      + '<div class="pn-b-tres">'
      + '<section class="rs-cd">' + P.cab('Do Drive até o ar')
      + '<div class="rs-cd-b">' + P.funilAcervo() + '</div></section>'
      + '<section class="rs-cd">' + P.cab('O dia da semana')
      + '<div class="rs-cd-b">' + P.colunas(P.porDiaSemana(), 150) + '</div></section>'
      + '<section class="rs-cd">' + P.cab('A hora de saída')
      + '<div class="rs-cd-b">' + P.colunas(P.porHora(), 150) + '</div></section>'
      + '</div>'

      + '<div class="pn-b-duas">'
      + '<section class="rs-cd">' + P.cab('Os dias com publicação',
          '<span class="rs-rot3">90 dias</span>')
      + '<div class="rs-cd-b">' + P.calor(91) + '</div></section>'
      + '<section class="rs-cd">' + P.cab('O acervo')
      + '<div class="rs-cd-b">' + P.rosca([
          { rot: 'Prateleira', v: R.prateleira, cor: 'var(--chart-1)' },
          { rot: 'Programados', v: R.fila, cor: 'var(--chart-3)' },
          { rot: 'Publicados', v: R.publicados, cor: 'var(--chart-2)' }
        ], P.n(R.acervo), 'no drive') + '</div></section>'
      + '</div>'

      + '<div class="pn-b-duas">'
      + '<section class="rs-cd">' + P.cab('As publicações por visualização')
      + '<div class="rs-cd-b">' + P.barrasH(P.porViews()) + '</div></section>'
      + '<section class="rs-cd">' + P.cab('O que trava',
          '<span class="rs-pil ' + (P.travas().length ? 'bl' : 'no') + '">'
          + P.travas().length + '</span>')
      + '<div class="rs-cd-b">' + P.listaTravas(P.travas()) + '</div></section>'
      + '</div>';
  }

  P.casca();
  montar();
  document.getElementById('pn-atualizar').addEventListener('click', montar);
})();

</script>
</body>
</html>
